name: Keep Relay Alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:           # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping relay health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RELAY_URL }}/health)
          echo "Relay responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: Relay returned $STATUS — may be starting up"
          fi
