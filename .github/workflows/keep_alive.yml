name: Keep Relay Alive

on:
  workflow_dispatch:   # manual trigger only — UptimeRobot handles automatic pinging

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping relay health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RELAY_URL }}/health)
          echo "Relay responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: Relay returned $STATUS"
            exit 1
          fi
          echo "Relay is live and healthy."
